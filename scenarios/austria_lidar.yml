# Same as austria.yml (the base DQN scenario) plus the `lidar` sensor.
#reward, termination and every other setting are unchanged so that base DQN and
#DQN + LiDAR differ only in the observation.
world:
  name: austria
agents:
  - id: A
    vehicle:
      name: racecar
      sensors: [ rgb_camera, pose, velocity, acceleration, lidar ]
    task:
      task_name: maximize_progress
      params: {laps: 1, time_limit: 120.0, terminate_on_collision: True}
